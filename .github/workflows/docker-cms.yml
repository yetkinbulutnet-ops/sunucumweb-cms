name: Build and publish Strapi CMS image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 Docker v2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=registry,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: |
            ghcr.io/yetkinbulutnet-ops/sunucumweb-cms:latest
            ghcr.io/yetkinbulutnet-ops/sunucumweb-cms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
